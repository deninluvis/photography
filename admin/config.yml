# Sveltia CMS config — https://sveltiacms.app
#
# Sign in at https://deninluvis.com/admin/ using "Sign In Using Access Token"
# with a GitHub personal access token scoped to this repo (Contents: Read/write).
# No OAuth app or proxy server needed for single-user use.
#
# (Optional upgrade later: uncomment base_url and point it at a deployed
# https://github.com/sveltia/sveltia-cms-auth Cloudflare Worker to enable the
# one-click "Sign In with GitHub" button instead of pasting a token.)

backend:
  name: github
  repo: deninluvis/photography
  branch: main
  # base_url: https://your-worker-name.your-subdomain.workers.dev

media_folder: ""
public_folder: ""

# Uploads are converted in the browser before they reach the repo.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2560
        height: 2560

collections:
  - name: photography
    label: Photography
    label_singular: Photo
    folder: images/photography
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    media_folder: ""
    public_folder: ""
    summary: "{{title}}"
    sortable_fields:
      - { field: slug, label: Date added, default_sort: desc }
      - { field: title, label: Title }
      - { field: location, label: Location }
      - { field: camera, label: Camera }
    view_groups:
      - { label: Location, field: location }
      - { label: Camera, field: camera }
      - { label: Orientation, field: orientation }
    fields:
      - label: Title
        name: title
        widget: string
      - label: Photo
        name: image
        widget: image
        accept: "image/jpeg,image/png,image/webp"
        hint: "JPG, PNG, or WEBP only — RAW/DNG files won't display in browsers. Uploads are converted to WebP, at most 2560px on the long edge."
      - label: Orientation
        name: orientation
        widget: select
        options:
          - { label: Portrait, value: portrait }
          - { label: Landscape, value: landscape }
          - { label: Square, value: square }
        hint: "Which way the photo actually is. Portrait slots in Highlighted Photos only list photos marked Portrait."
      - label: Location
        name: location
        widget: string
        required: false
        hint: "City and province, e.g. Niagara Falls, ON"
      - label: Camera
        name: camera
        widget: select
        required: false
        options:
          - Sony a7ii
          - iPhone 15 Pro Max
      - label: Hide from site
        name: hidden
        widget: boolean
        required: false
        default: false
        hint: "Keeps this photo in the CMS but off the website, including the home page highlights."

  - name: engineering
    label: Engineering Design
    label_singular: Render
    folder: images/engineering
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    media_folder: ""
    public_folder: ""
    summary: "{{title}}"
    sortable_fields:
      - { field: slug, label: Date added, default_sort: desc }
      - { field: title, label: Title }
    fields:
      - label: Title
        name: title
        widget: string
      - label: Render / Sketch
        name: image
        widget: image
        accept: "image/jpeg,image/png,image/webp"
      - label: Description
        name: description
        widget: text
        required: false
      - label: CAD Model Link
        name: link
        widget: string
        required: false
        hint: "Link to the model on Thangs, GrabCAD, Onshape, etc."
        pattern: ['^https://\S+$', 'Use a full link starting with https://']
      - label: Hide from site
        name: hidden
        widget: boolean
        required: false
        default: false
        hint: "Keeps this render in the CMS but off the website."

  - name: settings
    label: Home Page
    files:
      - name: highlights
        label: Highlighted Photos
        file: content/highlights.json
        fields:
          - label: Portrait Photos
            name: highlightsPortrait
            widget: list
            min: 3
            max: 3
            summary: "{{fields.image}}"
            hint: "Exactly 3 portrait photos for the featured grid on the home page, shown cropped to 2:3. Pick straight from your existing Photography entries — nothing to upload here."
            fields:
              - label: Photo
                name: image
                widget: relation
                collection: photography
                search_fields: [title, location]
                display_fields: [title, location]
                value_field: image
                filters:
                  - { field: orientation, values: [portrait] }
                hint: "Only photos marked Portrait are listed. Search by the title you gave it in the Photography collection — its caption there is reused here too."
          - label: Landscape Photos
            name: highlightsLandscape
            widget: list
            min: 3
            max: 3
            summary: "{{fields.image}}"
            hint: "Exactly 3 photos for the landscape slots in the featured grid on the home page, shown cropped to 3:2. Landscape shots fit best; a portrait shot will lose its top and bottom. Pick straight from your existing Photography entries — nothing to upload here."
            fields:
              - label: Photo
                name: image
                widget: relation
                collection: photography
                search_fields: [title, location]
                display_fields: [title, orientation, location]
                value_field: image
                hint: "Search by the title you gave it in the Photography collection — its caption there is reused here too."
