# Sveltia CMS config — https://sveltiacms.app
#
# Sign in at https://deninluvis.com/admin/ using "Sign In Using Access Token"
# with a GitHub personal access token scoped to this repo (Contents: Read/write).
# No OAuth app or proxy server needed for single-user use.
#
# (Optional upgrade later: uncomment base_url and point it at a deployed
# https://github.com/sveltia/sveltia-cms-auth Cloudflare Worker to enable the
# one-click "Sign In with GitHub" button instead of pasting a token.)

backend:
  name: github
  repo: deninluvis/photography
  branch: main
  # base_url: https://your-worker-name.your-subdomain.workers.dev

media_folder: ""
public_folder: ""

collections:
  - name: photography
    label: Photography
    label_singular: Photo
    folder: images/photography
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    media_folder: ""
    public_folder: ""
    summary: "{{title}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Photo
        name: image
        widget: image
        accept: "image/jpeg,image/png,image/webp"
        hint: "JPG, PNG, or WEBP only — RAW/DNG files won't display in browsers."
      - label: Location
        name: location
        widget: string
        required: false
      - label: Camera
        name: camera
        widget: string
        required: false

  - name: engineering
    label: Engineering Design
    label_singular: Render
    folder: images/engineering
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    media_folder: ""
    public_folder: ""
    summary: "{{title}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Render / Sketch
        name: image
        widget: image
        accept: "image/jpeg,image/png,image/webp"
      - label: Description
        name: description
        widget: text
        required: false
      - label: CAD Model Link
        name: link
        widget: string
        required: false
        hint: "Link to the model on Thangs, GrabCAD, Onshape, etc."

  - name: settings
    label: Site Settings
    files:
      - name: home
        label: Homepage
        file: content/home.json
        media_folder: "/images/site"
        public_folder: "/images/site"
        fields:
          - label: Hero Photo (Desktop)
            name: heroImage
            widget: image
            accept: "image/jpeg,image/png,image/webp"
            hint: "Pinned homepage background for desktop/wide screens — landscape, roughly 16:9. Stays fixed regardless of what's in the Photography gallery."
          - label: Hero Photo (Mobile)
            name: heroImageMobile
            widget: image
            accept: "image/jpeg,image/png,image/webp"
            required: false
            hint: "Optional — used on narrow/mobile screens instead of the desktop photo. Portrait, roughly 4:5 to 9:16. Leave empty to reuse the desktop photo everywhere."

      - name: highlights
        label: Highlighted Photos
        file: content/highlights.json
        fields:
          - label: Portrait Photos
            name: highlightsPortrait
            widget: list
            min: 3
            max: 3
            summary: "{{fields.image}}"
            hint: "Exactly 3 portrait photos (roughly 4:5, taller than wide) for the featured grid on the home page. Pick straight from your existing Photography entries — nothing to upload here."
            fields:
              - label: Photo
                name: image
                widget: relation
                collection: photography
                search_fields: [title]
                display_fields: [title]
                value_field: image
                hint: "Search by the title you gave it in the Photography collection — its caption there is reused here too."
          - label: Landscape Photos
            name: highlightsLandscape
            widget: list
            min: 3
            max: 3
            summary: "{{fields.image}}"
            hint: "Exactly 3 landscape photos (roughly 3:2, wider than tall) for the featured grid on the home page. Pick straight from your existing Photography entries — nothing to upload here."
            fields:
              - label: Photo
                name: image
                widget: relation
                collection: photography
                search_fields: [title]
                display_fields: [title]
                value_field: image
                hint: "Search by the title you gave it in the Photography collection — its caption there is reused here too."
