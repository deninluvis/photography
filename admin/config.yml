# Sveltia CMS config — https://sveltiacms.app
#
# Sign in at https://deninluvis.com/admin/ using "Sign In Using Access Token"
# with a GitHub personal access token scoped to this repo (Contents: Read/write).
# No OAuth app or proxy server needed for single-user use.
#
# (Optional upgrade later: uncomment base_url and point it at a deployed
# https://github.com/sveltia/sveltia-cms-auth Cloudflare Worker to enable the
# one-click "Sign In with GitHub" button instead of pasting a token.)

backend:
  name: github
  repo: deninluvis/photography
  branch: main
  # base_url: https://your-worker-name.your-subdomain.workers.dev

media_folder: ""
public_folder: ""

collections:
  - name: photography
    label: Photography
    label_singular: Photo
    folder: images/photography
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    media_folder: ""
    public_folder: ""
    summary: "{{title}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Photo
        name: image
        widget: image
        accept: "image/jpeg,image/png,image/webp"
        hint: "JPG, PNG, or WEBP only — RAW/DNG files won't display in browsers."
      - label: Location
        name: location
        widget: string
        required: false
      - label: Camera
        name: camera
        widget: string
        required: false

  - name: engineering
    label: Engineering Design
    label_singular: Render
    folder: images/engineering
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    media_folder: ""
    public_folder: ""
    summary: "{{title}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Render / Sketch
        name: image
        widget: image
        accept: "image/jpeg,image/png,image/webp"
      - label: Description
        name: description
        widget: text
        required: false
      - label: CAD Model Link
        name: link
        widget: string
        required: false
        hint: "Link to the model on Thangs, GrabCAD, Onshape, etc."

  - name: settings
    label: Site Settings
    files:
      - name: home
        label: Homepage
        file: content/home.json
        media_folder: "/images/site"
        public_folder: "/images/site"
        fields:
          - label: Hero Photo (Desktop)
            name: heroImage
            widget: image
            accept: "image/jpeg,image/png,image/webp"
            hint: "Pinned homepage background for desktop/wide screens — landscape, roughly 16:9. Stays fixed regardless of what's in the Photography gallery."
          - label: Hero Photo (Mobile)
            name: heroImageMobile
            widget: image
            accept: "image/jpeg,image/png,image/webp"
            required: false
            hint: "Optional — used on narrow/mobile screens instead of the desktop photo. Portrait, roughly 4:5 to 9:16. Leave empty to reuse the desktop photo everywhere."
          - label: Highlighted Photos (Home Page)
            name: highlights
            widget: list
            min: 6
            max: 6
            summary: "{{fields.orientation}} — {{fields.caption}}"
            hint: "Exactly 6 photos — 3 portrait and 3 landscape — for the featured grid on the home page. The grid is built from fixed slots, so photos should roughly match the ratio for whichever orientation you pick, or they'll get cropped to fit."
            fields:
              - label: Photo
                name: image
                widget: image
                accept: "image/jpeg,image/png,image/webp"
              - label: Orientation
                name: orientation
                widget: select
                options:
                  - { label: "Portrait — roughly 4:5, taller than wide", value: portrait }
                  - { label: "Landscape — roughly 3:2, wider than tall", value: landscape }
              - label: Caption (optional)
                name: caption
                widget: string
                required: false
