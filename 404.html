<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Denin Luvis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #0a0a0b;
      --surface:     #151415;
      --ink:         #f5f5f0;
      --ink-mid:     #9c9a94;
      --ink-soft:    #656259;
      --line:        rgba(245,245,240,0.08);
      --line-strong: rgba(245,245,240,0.16);
      --accent:      #d4a24e;
      --accent-dim:  #b8863a;
      --accent-soft: rgba(212,162,78,0.12);
      --accent-line: rgba(212,162,78,0.32);
      --accent-glow: rgba(212,162,78,0.35);
      --bg-rgb:      10,10,11;
      --shadow-md:   0 24px 56px -16px rgba(0,0,0,0.75);
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0 1.5rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 45% at 78% 12%, rgba(212,162,78,0.16), transparent 65%),
        repeating-linear-gradient(0deg, rgba(245,245,240,0.025) 0 1px, transparent 1px 64px),
        repeating-linear-gradient(90deg, rgba(245,245,240,0.025) 0 1px, transparent 1px 64px);
      pointer-events: none;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.6rem 3.5rem;
      border-bottom: 1px solid transparent;
      background: rgba(var(--bg-rgb),0.55);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      box-shadow: inset 0 1px 0 rgba(245,245,240,0.08), 0 12px 40px -16px rgba(0,0,0,0.55);
    }
    .nav-logo {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
    }
    .nav-links { display: flex; align-items: center; gap: 2.4rem; list-style: none; }
    .nav-links a {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--ink-mid);
      text-decoration: none;
      transition: color 0.2s;
      position: relative;
      padding-bottom: 0.3rem;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: var(--ink);
      transition: width 0.3s cubic-bezier(.16,.8,.24,1);
    }
    .nav-links a:hover { color: var(--ink); }
    .nav-links a:hover::after { width: 100%; }

    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.4rem;
    }
    .nav-toggle span { width: 20px; height: 1.5px; background: var(--ink); transition: transform 0.3s, opacity 0.3s; }
    .nav-toggle.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    @media (max-width: 700px) {
      nav { padding: 1.2rem 1.5rem; }
      .nav-links {
        position: fixed;
        top: 64px; left: 0; right: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 1.4rem;
        background: var(--surface);
        border-bottom: 1px solid var(--line-strong);
        box-shadow: inset 0 1px 0 rgba(245,245,240,0.06), 0 16px 40px -16px rgba(0,0,0,0.55);
        padding: 1.6rem 1.5rem 2rem;
        transform: translateY(-8px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s, transform 0.25s;
      }
      .nav-links.open { opacity: 1; transform: none; pointer-events: auto; }
      .nav-toggle { display: flex; }
    }

    .container {
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .error-label {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.6rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.15s forwards;
    }
    .error-label::before { content: ''; width: 16px; height: 1px; background: var(--accent); }

    .error-number {
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--ink);
      position: relative;
      opacity: 0;
      animation: fadeUp 0.8s 0.28s forwards;
      user-select: none;
    }
    .error-number .accent { color: var(--accent); }

    .error-heading {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 1.2rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.42s forwards;
    }
    .error-heading .accent-text { color: var(--accent); }

    .error-sub {
      font-size: 0.92rem;
      color: var(--ink-mid);
      margin-top: 1rem;
      line-height: 1.75;
      max-width: 380px;
      opacity: 0;
      animation: fadeUp 0.8s 0.55s forwards;
    }

    .error-actions {
      display: flex;
      gap: 0.9rem;
      margin-top: 2.4rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.7s forwards;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.85rem 1.6rem;
      border-radius: 8px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: transform 0.25s, background 0.25s, color 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .btn-primary { background: var(--ink); color: var(--bg); border: 1px solid var(--ink); }
    .btn-primary:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md), 0 0 40px var(--accent-glow); }
    .btn-ghost { border: 1px solid var(--line-strong); color: var(--ink); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); transform: translateY(-2px); box-shadow: 0 0 28px var(--accent-glow); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Denin Luvis</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/photography.html">Photography</a></li>
      <li><a href="/engineering.html">Engineering</a></li>
      <li><a href="/about.html">About</a></li>
      <li><a href="/contact.html">Contact</a></li>
    </ul>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="container">
    <p class="error-label">Error · Page not found</p>
    <p class="error-number">4<span class="accent">0</span>4</p>
    <h1 class="error-heading">This page never got <span class="accent-text">developed.</span></h1>
    <p class="error-sub">This page doesn't exist — or it's been moved. Let's get you back to something that does.</p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary">← Back to home</a>
      <a href="/contact.html" class="btn btn-ghost">Contact me</a>
    </div>
  </div>

  <script>
    const navToggle = document.getElementById('nav-toggle');
    const navLinks = document.getElementById('nav-links');
    navToggle.addEventListener('click', () => {
      const open = navLinks.classList.toggle('open');
      navToggle.classList.toggle('open', open);
      navToggle.setAttribute('aria-expanded', String(open));
    });
  </script>
</body>
</html>
