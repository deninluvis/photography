<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Denin Luvis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #0a0a0b;
      --surface:     #151415;
      --ink:         #f5f5f0;
      --ink-mid:     #9c9a94;
      --ink-soft:    #656259;
      --line:        rgba(245,245,240,0.08);
      --line-strong: rgba(245,245,240,0.16);
      --accent:      #d4a24e;
      --accent-dim:  #b8863a;
      --accent-soft: rgba(212,162,78,0.12);
      --accent-line: rgba(212,162,78,0.32);
      --accent-glow: rgba(212,162,78,0.35);
      --bg-rgb:      10,10,11;
      --shadow-md:   0 24px 56px -16px rgba(0,0,0,0.75);
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0 1.5rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 45% at 78% 12%, rgba(212,162,78,0.16), transparent 65%),
        repeating-linear-gradient(0deg, rgba(245,245,240,0.025) 0 1px, transparent 1px 64px),
        repeating-linear-gradient(90deg, rgba(245,245,240,0.025) 0 1px, transparent 1px 64px);
      pointer-events: none;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 1.6rem 3.5rem;
      border-bottom: 1px solid var(--line);
      background: rgba(var(--bg-rgb),0.82);
      backdrop-filter: blur(14px);
    }
    .nav-logo {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
    }

    .container {
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .error-label {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.6rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.15s forwards;
    }
    .error-label::before { content: ''; width: 16px; height: 1px; background: var(--accent); }

    .error-number {
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--ink);
      position: relative;
      opacity: 0;
      animation: fadeUp 0.8s 0.28s forwards;
      user-select: none;
    }
    .error-number .accent { color: var(--accent); }

    .error-heading {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 1.2rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.42s forwards;
    }
    .error-heading .accent-text { color: var(--accent); }

    .error-sub {
      font-size: 0.92rem;
      color: var(--ink-mid);
      margin-top: 1rem;
      line-height: 1.75;
      max-width: 380px;
      opacity: 0;
      animation: fadeUp 0.8s 0.55s forwards;
    }

    .error-actions {
      display: flex;
      gap: 0.9rem;
      margin-top: 2.4rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.7s forwards;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.85rem 1.6rem;
      border-radius: 8px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: transform 0.25s, background 0.25s, color 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .btn-primary { background: var(--ink); color: var(--bg); border: 1px solid var(--ink); }
    .btn-primary:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md), 0 0 40px var(--accent-glow); }
    .btn-ghost { border: 1px solid var(--line-strong); color: var(--ink); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); transform: translateY(-2px); box-shadow: 0 0 28px var(--accent-glow); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Denin Luvis</a>
  </nav>

  <div class="container">
    <p class="error-label">Error · Page not found</p>
    <p class="error-number">4<span class="accent">0</span>4</p>
    <h1 class="error-heading">Lost in the <span class="accent-text">blueprint.</span></h1>
    <p class="error-sub">This page doesn't exist — or it's been moved. Let's get you back to something that does.</p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary">← Back to home</a>
      <a href="/#contact" class="btn btn-ghost">Contact me</a>
    </div>
  </div>

</body>
</html>
